server.port=8080

# PostgreSQL (values injected via environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/celebratehub}
spring.datasource.username=${DATABASE_USERNAME:celebratehub}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false
